<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="veycraft-document" content="resume">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src 'none'; base-uri 'none'; form-action 'none'">
  <title>{{FULL_NAME}} — Resume</title>
  <style>
    @page { size: A4; margin: 14mm 16mm; }
    @media print {
      html, body { width: 210mm; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      section, article, ul, li, p { orphans: 3; widows: 3; }
      h1, h2, h3 { break-after: avoid; page-break-after: avoid; }
      li, .role-block, header { break-inside: avoid; page-break-inside: avoid; }
    }
    body { font: 10.5pt Arial, Helvetica, sans-serif; color: #111; background: #fff; line-height: 1.36; margin: 0; }
    h1 { font-size: 20pt; margin: 0 0 4pt; }
    h2 { font-size: 11.5pt; border-bottom: 1px solid #777; margin: 12pt 0 5pt; break-after: avoid; page-break-after: avoid; }
    h3 { font-size: 10.5pt; margin: 7pt 0 2pt; break-after: avoid; page-break-after: avoid; }
    p { margin: 4pt 0; overflow-wrap: anywhere; orphans: 3; widows: 3; }
    ul { padding-left: 15pt; margin: 4pt 0; }
    li { margin: 2.5pt 0; break-inside: avoid; page-break-inside: avoid; }
    a { color: inherit; text-decoration: none; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <header><h1>{{FULL_NAME}}</h1><p>{{CONTACT_TEXT}}</p><p>{{VERIFIED_LINKS_HTML}}</p></header>
  <main>
    <section><h2>Professional Summary</h2><p>{{SUMMARY_TEXT}}</p></section>
    <section><h2>Technical Skills</h2><p>{{SKILLS_TEXT}}</p></section>
    <section><h2>Experience</h2>{{EXPERIENCE_HTML}}</section>
    <section><h2>Projects</h2>{{PROJECTS_HTML}}</section>
    <section><h2>Education</h2>{{EDUCATION_HTML}}</section>
  </main>
</body>
</html>
